<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPIROC | RockTool Consumption</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
    :root { --epi-black: #000; --epi-yellow: #FFCE00; --bg: #0c0c0c; --card: #181818; --text: #fff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding-bottom: 50px; }

    header { background-color: #1a1a1a; padding: 10px 20px; border-bottom: 3px solid var(--epi-yellow); }
    .header-container { display: flex; align-items: center; justify-content: space-between; max-width: 1200px; margin: 0 auto; }
    .header-title { color: #ffffff; font-size: 1.5rem; font-weight: bold; text-transform: uppercase; text-align: center; flex-grow: 1; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

    .control-bar { background: #111; padding: 15px 20px; display: grid; gap: 12px; border-bottom: 1px solid #222; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); align-items: end; }
    .item { display: flex; flex-direction: column; gap: 4px; }
    .item label { font-size: 0.65rem; font-weight: 800; color: var(--epi-yellow); text-transform: uppercase; }
    .item select, .item input { background: #262626; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 4px; font-size: 0.85rem; width: 100%; outline: none; }
    .item select:focus, .item input:focus { border-color: var(--epi-yellow); }

    .sync-btn { background: var(--epi-yellow); color: #000; border: none; padding: 10px; border-radius: 4px; font-weight: 900; cursor: pointer; text-transform: uppercase; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 5px; }
    .sync-btn:hover { background: #e6b800; }

    main { padding: 25px 20px; max-width: 98vw; margin: 0 auto; display: none; }
    
    .table-wrapper { overflow-x: auto; margin-bottom: 20px; }
    #fleet-container { min-width: max-content; }

    /* --- SHIFT FOLDER STYLES --- */
    .shift-folder { margin-bottom: 15px; border: 1px solid #333; border-radius: 6px; overflow: hidden; }
    .shift-header { background: #111; padding: 12px 15px; font-weight: 900; font-size: 1.1rem; color: #fff; cursor: pointer; border-left: 4px solid var(--epi-yellow); display: flex; align-items: center; gap: 10px; text-transform: uppercase; border-bottom: 1px solid #222; transition: 0.2s; }
    .shift-header:hover { background: #1a1a1a; }
    .shift-content { background: var(--card); display: block; }
    
    /* --- FLEET & SHIFT COLUMNS --- */
    .t-header-row { display: flex; gap: 8px; padding: 10px; background: #222; font-size: 0.7rem; text-transform: uppercase; font-weight: bold; color: #aaa; border-bottom: 2px solid var(--epi-yellow); position: sticky; top: 0; z-index: 10; }
    .t-row { display: flex; gap: 8px; padding: 8px 10px; border-bottom: 1px solid #222; align-items: stretch; background: #111; }
    .t-row:hover { background: #1a1a1a; }

    .t-fleet-container { width: 280px; flex-shrink: 0; display: flex; align-items: stretch; border-right: 1px solid #333; padding-right: 10px; }
    .t-fleet-name { flex: 1; font-weight: bold; color: var(--epi-yellow); font-size: 0.9rem; display: flex; align-items: center; }
    .t-fleet-shift { width: 70px; border-left: 1px solid #333; padding-left: 10px; font-size: 0.85rem; display: flex; align-items: center; font-weight: bold; color: #fff; }

    .t-row input, .t-row select { background: #000; color: #fff; border: 1px solid #444; padding: 6px; font-size: 0.8rem; border-radius: 3px; width: 100%; outline: none; }
    .t-row input:focus, .t-row select:focus { border-color: var(--epi-yellow); }

    .t-parts { display: flex; gap: 5px; }
    .t-part-block { display: flex; gap: 4px; align-items: center; background: #000; padding: 4px; border: 1px solid #333; border-radius: 4px; flex-shrink: 0; }
    
    .p-type { width: 120px; }
    .p-hole { width: 160px; }
    .p-part { width: 140px; }
    .p-reason { width: 130px; }
    .p-qty { width: 60px; }
    .p-old { width: 60px; border-color: #00E676 !important; }
    .p-bend { width: 70px; border-color: #F44336 !important; }

    .btn-del-table { background: #444; color: #fff; border: none; padding: 6px 10px; border-radius: 3px; cursor: pointer; margin-left: 2px; }
    .btn-del-table:hover { background: #ff4444; }

    .btn-add-table { background: #222; color: var(--epi-yellow); border: 1px dashed var(--epi-yellow); padding: 0 15px; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: bold; display: flex; align-items: center; justify-content: center; margin-left: 5px; flex-shrink: 0; }
    .btn-add-table:hover { background: #333; }

    .primary-btn { background: var(--epi-yellow); color: #000; border: none; padding: 15px; border-radius: 6px; font-weight: 900; font-size: 1rem; cursor: pointer; width: 100%; max-width: 400px; margin: 20px auto; display: block; text-transform: uppercase; }
    
    .table-wrapper::-webkit-scrollbar { height: 10px; }
    .table-wrapper::-webkit-scrollbar-track { background: #111; }
    .table-wrapper::-webkit-scrollbar-thumb { background: #444; border-radius: 5px; }
    .table-wrapper::-webkit-scrollbar-thumb:hover { background: var(--epi-yellow); }

    /* Modal Styles */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 9000; padding: 20px; }
    .modal-content { background: #111; border: 1px solid #444; border-top: 4px solid var(--epi-yellow); border-radius: 8px; width: 100%; max-width: 800px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; }
    .modal-header { padding: 15px 20px; background: #000; font-weight: bold; font-size: 1.2rem; color: var(--epi-yellow); text-transform: uppercase; border-bottom: 1px solid #333; }
    .modal-body { padding: 20px; overflow-y: auto; flex-grow: 1; }
    .modal-footer { padding: 15px 20px; background: #000; border-top: 1px solid #333; display: flex; justify-content: flex-end; gap: 10px; }
    
    .summary-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; color: #fff; }
    .summary-table th { background: #222; color: #aaa; padding: 8px; text-align: left; border-bottom: 1px solid #444; text-transform: uppercase; }
    .summary-table td { padding: 8px; border-bottom: 1px solid #222; }
    
    .btn-cancel { background: transparent; border: 1px solid #666; color: #fff; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-confirm { background: var(--epi-yellow); border: none; color: #000; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: 900; text-transform: uppercase; }

    #loader { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; color: var(--epi-yellow); font-weight: bold; font-size: 1.2rem; display: none; }
</style>
</head>
<body>

<div id="loader"><i class="fas fa-spinner fa-spin fa-2x" style="margin-bottom: 15px;"></i> <span id="load-text">Processing...</span></div>

<header>
    <div class="header-container">
        <div class="header-title">ROCKTOOL CONSUMPTION REPORT</div>
    </div>
</header>

<div class="control-bar" id="auth-bar">
    <div class="item"><label>Technician ID</label><input type="text" id="user" placeholder="Tech ID"></div>
    <div class="item"><label>Password</label><input type="password" id="pass" placeholder="••••"></div>
    <div class="item"><button class="sync-btn" onclick="handleSync()"><i class="fas fa-lock" id="icon"></i> AUTHENTICATE & SYNC</button></div>
</div>

<div class="control-bar" id="data-bar" style="display: none;">
    <div class="item"><label>Date</label><input type="date" id="date"></div>
    <div class="item"><label>Customer</label><select id="cust" onchange="updateSites()"></select></div>
    <div class="item"><label>Work Site</label><select id="site" onchange="buildFleetDashboard()"></select></div>
    
    <div class="item" style="flex-direction: row; gap: 10px;">
        <div class="item" style="flex-direction: row; gap: 10px;">
    <button class="sync-btn" style="background:#00E676; color:#000;" onclick="downloadCSVTemplate()"><i class="fas fa-file-csv"></i> TEMPLATE</button>
    
    <input type="file" id="csvFileInput" accept=".csv" style="display:none" onchange="handleFileUpload(event)">
    <button class="sync-btn" style="background:#fff; color:#000;" onclick="document.getElementById('csvFileInput').click()"><i class="fas fa-upload"></i> UPLOAD CSV</button>
</div>
        <button class="sync-btn" style="background:#333; color:#fff; width: 100%;" onclick="location.reload()"><i class="fas fa-sign-out-alt"></i> LOGOUT</button>
    </div>
</div>

<main id="main-area">
    <div class="table-wrapper">
        <div id="fleet-container"></div>
    </div>
    <button type="button" class="primary-btn" onclick="reviewData()">REVIEW & SUBMIT RECORDS</button>
</main>

<div class="modal-overlay" id="confirmModal">
    <div class="modal-content">
        <div class="modal-header">Confirm Submission</div>
        <div class="modal-body">
            <p style="margin-bottom: 15px; font-size: 0.9rem; color: #ccc;">Verify quantities below. Reconcile returned vs lost items before uploading to Vault.</p>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>Fleet</th>
                        <th>Type / Description</th>
                        <th>Reason</th>
                        <th>New Qty</th>
                        <th style="color:#00E676;">Old Rtn</th>
                        <th style="color:#F44336;">Lost/Bent</th>
                    </tr>
                </thead>
                <tbody id="summaryBody"></tbody>
            </table>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeModal()">Edit</button>
            <button class="btn-confirm" id="finalSubmitBtn" onclick="executeSubmission()">Confirm & Upload</button>
        </div>
    </div>
</div>

<script>
// 🚨 PASTE YOUR DEPLOYED GOOGLE APP SCRIPT URL HERE 🚨
const scriptURL = "https://script.google.com/macros/s/AKfycbwnhqpKWtP7AdhT0NGIGwNIBWv3yTUU3jtXeD6QF-phPxe5ZKaGyw2RY5WBzezfefEp/exec";

// Global Mappings
let customerToSites = {};
let siteToFleet = {};
let fleetToShifts = {}; // NEW: Stores an array of multiple shifts per fleet
let typeToReasons = {}; 
let pendingPayload = []; 

// Tool Type Dynamic Mappings
let siteToToolTypes = {};
let siteToolToHoles = {};
let siteToolHoleToParts = {};

window.onload = () => document.getElementById('date').valueAsDate = new Date();

async function handleSync() {
    const u = document.getElementById('user').value.trim();
    const p = document.getElementById('pass').value.trim();
    if (!u || !p) return alert("Please enter ID and Password");

    document.getElementById('loader').style.display = 'flex';
    document.getElementById('load-text').innerText = "Authenticating...";

    try {
        const url = scriptURL + "?action=check&u=" + encodeURIComponent(u) + "&p=" + encodeURIComponent(p) + "&t=" + new Date().getTime();
        const res = await fetch(url);
        
        const textResponse = await res.text();
        let data;
        try {
            data = JSON.parse(textResponse);
        } catch (parseErr) {
            console.error("Raw response:", textResponse);
            throw new Error("Server returned an invalid format. Check Apps Script logs.");
        }

        document.getElementById('loader').style.display = 'none';

        if (data.status === "success") {
            buildDatabase(data);
            document.getElementById('auth-bar').style.display = 'none';
            document.getElementById('data-bar').style.display = 'grid';
            
            const custSelect = document.getElementById('cust');
            custSelect.innerHTML = '<option value="">- Select Customer -</option>';
            Object.keys(customerToSites).sort().forEach(c => custSelect.add(new Option(c, c)));
            
        } else if (data.status === "server_error") {
            alert("Backend Error: " + data.message);
        } else {
            alert("Auth Failed: Incorrect Password or ID.");
        }
    } catch (err) {
        document.getElementById('loader').style.display = 'none';
        alert("Network/Auth Error: " + err.message);
    }
}

function buildDatabase(data) {
    typeToReasons = {};
    if (data.reasonsList) {
        data.reasonsList.forEach(row => {
            let type = String(row[0] || "").trim();
            let reasonStr = String(row[1] || "").trim();
            if (type && reasonStr) {
                if (!typeToReasons[type]) typeToReasons[type] = [];
                reasonStr.split(',').forEach(r => {
                    let cleanReason = r.trim();
                    if (cleanReason && !typeToReasons[type].includes(cleanReason)) typeToReasons[type].push(cleanReason);
                });
            }
        });
    }

    customerToSites = {}; 
    siteToFleet = {}; 
    fleetToShifts = {}; // Initialize array mapping

    if (data.fleetList) {
        data.fleetList.forEach(row => {
            let cust = String(row[0] || "").trim();
            let site = String(row[2] || "").trim();
            let fleet = String(row[3] || "").trim();
            let shiftRaw = String(row[5] || "Unassigned").trim(); 
            
            if (cust && site) {
                if (!customerToSites[cust]) customerToSites[cust] = [];
                if (!customerToSites[cust].includes(site)) customerToSites[cust].push(site);
                if (fleet) {
                    if (!siteToFleet[site]) siteToFleet[site] = [];
                    if (!siteToFleet[site].includes(fleet)) siteToFleet[site].push(fleet);
                    
                    // 🚨 EXPLODE COMMA-SEPARATED SHIFTS INTO AN ARRAY 🚨
                    fleetToShifts[fleet] = shiftRaw.split(',')
                        .map(s => s.trim().toUpperCase())
                        .filter(s => s);
                    
                    // Fallback if empty
                    if (fleetToShifts[fleet].length === 0) {
                        fleetToShifts[fleet] = ["UNASSIGNED"];
                    }
                }
            }
        });
    }

    siteToToolTypes = {};
    siteToolToHoles = {};
    siteToolHoleToParts = {};

    if (data.toolTypesList) {
        data.toolTypesList.forEach(row => {
            let site = String(row[0] || "").trim().toUpperCase(); 
            let holeType = String(row[1] || "").trim();   
            let toolType = String(row[2] || "").trim();   
            let partNo = String(row[3] || "").trim();     

            if (site && toolType) {
                if (!siteToToolTypes[site]) siteToToolTypes[site] = new Set();
                siteToToolTypes[site].add(toolType);

                if (holeType) {
                    let key1 = site + "_" + toolType;
                    if (!siteToolToHoles[key1]) siteToolToHoles[key1] = new Set();
                    siteToolToHoles[key1].add(holeType);

                    if (partNo) {
                        let key2 = site + "_" + toolType + "_" + holeType;
                        if (!siteToolHoleToParts[key2]) siteToolHoleToParts[key2] = new Set();
                        siteToolHoleToParts[key2].add(partNo);
                    }
                }
            }
        });
    }
}

function updateSites() {
    const s = document.getElementById('site');
    s.innerHTML = '<option value="">- Select Site -</option>';
    const c = document.getElementById('cust').value;
    if (customerToSites[c]) customerToSites[c].sort().forEach(site => s.add(new Option(site, site)));
    document.getElementById('main-area').style.display = 'none';
}

function buildFleetDashboard() {
    const container = document.getElementById('fleet-container');
    container.innerHTML = "";
    const site = document.getElementById('site').value;
    
    if (!site || !siteToFleet[site]) return;

    // 1. Group Fleets by Shift (Splitting into individual folders)
    const shifts = {};
    siteToFleet[site].forEach(fleet => {
        const fShifts = fleetToShifts[fleet] || ["UNASSIGNED"];
        fShifts.forEach(s => {
            let shiftName = s;
            if (!shiftName.includes("SHIFT") && shiftName !== "UNASSIGNED") {
                shiftName = "SHIFT " + shiftName; // Auto-format "C" to "SHIFT C"
            }
            if (!shifts[shiftName]) shifts[shiftName] = [];
            shifts[shiftName].push(fleet);
        });
    });

    // 2. Build Folder for each isolated Shift in specific order (C, A, B)
    const shiftOrder = { "SHIFT C": 1, "SHIFT A": 2, "SHIFT B": 3 };
    
    Object.keys(shifts).sort((a, b) => (shiftOrder[a] || 99) - (shiftOrder[b] || 99)).forEach(shift => {
        const safeShiftId = shift.replace(/[^a-zA-Z0-9]/g, '-');
        const folder = document.createElement('div');
        folder.className = "shift-folder";
        
        // Folder Accordion Header
        const header = document.createElement('div');
        header.className = "shift-header";
        header.innerHTML = `<i class="fas fa-layer-group"></i> ALL FLEETS - ${shift}`;
        header.onclick = function() {
            const content = this.nextElementSibling;
            content.style.display = content.style.display === "none" ? "block" : "none";
        };
        
        // Folder Content Area
        const content = document.createElement('div');
        content.className = "shift-content";

        // Folder Internal Table Header
        const tableHeader = document.createElement('div');
        tableHeader.className = "t-header-row";
        tableHeader.innerHTML = `
            <div class="t-fleet-container">
                <div class="t-fleet-name">FLEET ASSET</div>
                <div class="t-fleet-shift" style="color:#aaa;">SHIFT</div>
            </div>
            <div style="padding-left:5px;">CONSUMABLES ADDED <span style="color:#666; text-transform:none;">(Tool Type, Hole Type, Part No, Reason, New Qty, Old Rtn, Lost/Bent)</span></div>
        `;
        content.appendChild(tableHeader);

        // Add Fleets inside this folder
        shifts[shift].sort().forEach(fleet => {
            const row = document.createElement('div');
            row.className = "t-row";
            // Store fleet and specific shift in data attributes to avoid ID clashes
            row.setAttribute('data-fleet', fleet);
            row.setAttribute('data-shift', shift);
            row.innerHTML = `
                <div class="t-fleet-container">
                    <div class="t-fleet-name">${fleet}</div>
                    <div class="t-fleet-shift">${shift}</div>
                </div>
                <div class="t-parts" id="parts-${fleet}-${safeShiftId}"></div>
                <button type="button" class="btn-add-table" onclick="addPartColumn('${fleet}', '${safeShiftId}')" title="Add Part">+</button>
            `;
            content.appendChild(row);
        });

        folder.appendChild(header);
        folder.appendChild(content);
        container.appendChild(folder);
    });

    // 3. Initialize Dropdowns once the DOM is assembled
    Object.keys(shifts).forEach(shift => {
        const safeShiftId = shift.replace(/[^a-zA-Z0-9]/g, '-');
        shifts[shift].forEach(fleet => addPartColumn(fleet, safeShiftId));
    });

    document.getElementById('main-area').style.display = 'block';
}

function addPartColumn(fleetId, safeShiftId) {
    const currentSite = document.getElementById('site').value.toUpperCase();
    
    let typeOpts = '';
    if (siteToToolTypes[currentSite]) {
        Array.from(siteToToolTypes[currentSite]).sort().forEach(t => {
            typeOpts += `<option value="${t}">${t}</option>`;
        });
    }

    const block = document.createElement('div');
    block.className = "t-part-block";
    block.innerHTML = `
        <select class="p-type" onchange="updateRowCascades(this)"><option value="">- Tool Type -</option>${typeOpts}</select>
        <select class="p-hole" onchange="updatePartNoCascade(this)"><option value="">- Hole Type -</option></select>
        <select class="p-part"><option value="">- Part No -</option></select>
        <select class="p-reason"><option value="">- Reason -</option></select>
        <input type="number" class="p-qty" placeholder="New Qty" title="New Quantity Issued">
        <input type="number" class="p-old" placeholder="Old Rtn" title="Old Quantity Returned">
        <input type="number" class="p-bend" placeholder="Lost/Bent" title="Quantity Lost or Bent">
        <button type="button" class="btn-del-table" onclick="this.parentElement.remove()" title="Remove">X</button>
    `;
    
    // Attach to the unique container for this specific fleet and shift
    document.getElementById(`parts-${fleetId}-${safeShiftId}`).appendChild(block);
}

function updateRowCascades(el) {
    const block = el.closest('.t-part-block');
    const currentSite = document.getElementById('site').value.toUpperCase();
    const toolType = el.value;
    
    const holeSel = block.querySelector('.p-hole');
    const partSel = block.querySelector('.p-part');
    const reasonSel = block.querySelector('.p-reason');
    
    holeSel.innerHTML = '<option value="">- Hole Type -</option>';
    partSel.innerHTML = '<option value="">- Part No -</option>';
    reasonSel.innerHTML = '<option value="">- Reason -</option>';
    
    const key1 = currentSite + "_" + toolType;
    if (siteToolToHoles[key1]) {
        Array.from(siteToolToHoles[key1]).sort().forEach(h => holeSel.add(new Option(h, h)));
    }

    if (typeToReasons[toolType]) {
        typeToReasons[toolType].sort().forEach(r => reasonSel.add(new Option(r, r)));
    }
}

function updatePartNoCascade(el) {
    const block = el.closest('.t-part-block');
    const currentSite = document.getElementById('site').value.toUpperCase();
    const toolType = block.querySelector('.p-type').value;
    const holeType = el.value;
    const partSel = block.querySelector('.p-part');

    partSel.innerHTML = '<option value="">- Part No -</option>';

    const key2 = currentSite + "_" + toolType + "_" + holeType;
    if (siteToolHoleToParts[key2]) {
        const parts = Array.from(siteToolHoleToParts[key2]).sort();
        
        parts.forEach(p => partSel.add(new Option(p, p)));

        if (parts.length === 1) {
            partSel.value = parts[0];
        }
    }
}

function reviewData() {
    pendingPayload = [];
    const summaryBody = document.getElementById('summaryBody');
    summaryBody.innerHTML = '';
    
    const tech = document.getElementById('user').value;
    const pass = document.getElementById('pass').value;
    const cust = document.getElementById('cust').value;
    const site = document.getElementById('site').value;
    const date = document.getElementById('date').value;

    // Iterate through all rows, extracting the specific shift applied
    document.querySelectorAll('.t-row').forEach(row => {
        const fleetId = row.getAttribute('data-fleet');
        const currentShift = row.getAttribute('data-shift');

        row.querySelectorAll('.t-part-block').forEach(block => {
            const type = block.querySelector('.p-type').value;
            const desc = block.querySelector('.p-hole').value; 
            const no = block.querySelector('.p-part').value;   
            const reason = block.querySelector('.p-reason').value;
            
            const qty = parseFloat(block.querySelector('.p-qty').value) || 0;
            const oldRtn = parseFloat(block.querySelector('.p-old').value) || 0;
            const bendLost = parseFloat(block.querySelector('.p-bend').value) || 0;

            if (type && qty > 0) {
                pendingPayload.push({
                    Technician_Name: tech,
                    Unlock_Password: pass,
                    Customer_Name: cust,
                    Work_Site: site,
                    Shift: currentShift, 
                    Fleet_ID: fleetId,
                    Entry_Date: date,
                    Part_Group: "", 
                    Part_Type: type,
                    Part_Description: desc,
                    Part_Number: no,
                    Quantity: qty,
                    Reason_to_Replace: reason,
                    Remarks: "Added via App", 
                    Old_Return_Qty: oldRtn,      
                    Bend_Lost_Qty: bendLost,     
                    Unit_Price: 0, 
                    File_ID: "BULK_" + Date.now() 
                });

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="color: var(--epi-yellow); font-weight: bold;">${fleetId} <span style="color:#aaa; font-size:0.7rem;">(${currentShift})</span></td>
                    <td>${type}<br><span style="color:#888; font-size:0.75rem;">${desc || "No Description"}</span></td>
                    <td>${reason || "-"}</td>
                    <td style="font-weight: bold;">${qty}</td>
                    <td style="color: #00E676; font-weight: bold;">${oldRtn}</td>
                    <td style="color: #F44336; font-weight: bold;">${bendLost}</td>
                `;
                summaryBody.appendChild(tr);
            }
        });
    });

    if (pendingPayload.length === 0) return alert("No valid parts data entered. Please fill Type and New Qty.");
    document.getElementById('confirmModal').style.display = 'flex';
}

function closeModal() { document.getElementById('confirmModal').style.display = 'none'; }

async function executeSubmission() {
    closeModal();
    const btn = document.getElementById('finalSubmitBtn');
    btn.disabled = true;

    document.getElementById('loader').style.display = 'flex';
    document.getElementById('load-text').innerText = "Uploading to Vault...";

    try {
        const res = await fetch(scriptURL, { method: "POST", body: JSON.stringify(pendingPayload), mode: 'no-cors' });
        document.getElementById('loader').style.display = 'none';
        alert(`✅ SUCCESS: ${pendingPayload.length} part records saved to Database.`);
        
        // 🚨 RESET THE FORM INSTEAD OF HIDING IT 🚨
        buildFleetDashboard(); 
        
        btn.disabled = false;
        pendingPayload = []; 
    } catch (err) {
        document.getElementById('loader').style.display = 'none';
        alert("❌ Submission Error: " + err);
        btn.disabled = false;
    }
}
function downloadCSVTemplate() {
    const headers = [
        "Fleet_ID", "Entry_Date", "Part_Type", "Hole_Type", 
        "Part_Number", "Quantity", "Reason_to_Replace", "Old_Return_Qty", 
        "Bend_Lost_Qty", "Unit_Price", "Remarks"
    ];
    const csvContent = "data:text/csv;charset=utf-8," + headers.join(",") + "\n";
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "Rocktool_Compact_Template.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

async function handleFileUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const activeTech = document.getElementById('user').value;
    const activePass = document.getElementById('pass').value;
    const activeCust = document.getElementById('cust').value;
    const activeSite = document.getElementById('site').value;

    if (!activeCust || !activeSite) {
        alert("Please select a Customer and Work Site from the dropdown menus before uploading the CSV.");
        event.target.value = ''; 
        return;
    }

    document.getElementById('loader').style.display = 'flex';
    document.getElementById('load-text').innerText = "Parsing & Uploading CSV...";

    const reader = new FileReader();
    reader.onload = async function(e) {
        const text = e.target.result;
        const rows = text.split("\n").filter(row => row.trim() !== "");
        const headers = rows[0].split(",");
        
        let jsonData = [];
        
        for (let i = 1; i < rows.length; i++) {
            const values = rows[i].split(",");
            if (!values[0] || values[0].trim() === "") continue;

            const fleetId = values[0].trim();
            
            // If the user uploads via CSV, we bundle all assigned shifts together 
            // since the CSV template doesn't specify an individual shift.
            const fleetShifts = fleetToShifts[fleetId] || ["Unassigned"];
            const shiftString = fleetShifts.join(', ');

            jsonData.push({
                Technician_Name: activeTech,
                Unlock_Password: activePass,
                Customer_Name: activeCust,
                Work_Site: activeSite,
                Shift: shiftString, 
                Fleet_ID: fleetId,
                Entry_Date: values[1] ? values[1].trim() : "",
                Part_Type: values[2] ? values[2].trim() : "",
                Hole_Type: values[3] ? values[3].trim() : "",
                Part_Number: values[4] ? values[4].trim() : "",
                Quantity: parseFloat(values[5]) || 0,
                Reason_to_Replace: values[6] ? values[6].trim() : "",
                Old_Return_Qty: parseFloat(values[7]) || 0,
                Bend_Lost_Qty: parseFloat(values[8]) || 0,
                Unit_Price: parseFloat(values[9]) || 0,
                Remarks: values[10] ? values[10].trim() : "Bulk Upload",
                File_ID: "BULK_" + Date.now() + "_" + i
            });
        }

        try {
            const res = await fetch(scriptURL, { 
                method: "POST", 
                body: JSON.stringify(jsonData), 
                mode: 'no-cors' 
            });
            document.getElementById('loader').style.display = 'none';
            alert(`✅ Success: ${jsonData.length} records processed for site ${activeSite}.`);
            event.target.value = ''; 
        } catch (err) {
            document.getElementById('loader').style.display = 'none';
            alert("Upload Error: " + err);
            event.target.value = '';
        }
    };
    reader.readAsText(file);
}
</script>
