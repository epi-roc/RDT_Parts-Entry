<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPIROC | RockTool Consumption</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
    :root { --epi-black: #000; --epi-yellow: #FFCE00; --bg: #0c0c0c; --card: #181818; --text: #fff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding-bottom: 50px; }

    header { background-color: #1a1a1a; padding: 10px 20px; border-bottom: 3px solid var(--epi-yellow); }
    .header-container { display: flex; align-items: center; justify-content: space-between; max-width: 1200px; margin: 0 auto; }
    .header-title { color: #ffffff; font-size: 1.5rem; font-weight: bold; text-transform: uppercase; text-align: center; flex-grow: 1; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

    .control-bar { background: #111; padding: 15px 20px; display: grid; gap: 12px; border-bottom: 1px solid #222; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); align-items: end; }
    .item { display: flex; flex-direction: column; gap: 4px; }
    .item label { font-size: 0.65rem; font-weight: 800; color: var(--epi-yellow); text-transform: uppercase; }
    .item select, .item input { background: #262626; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 4px; font-size: 0.85rem; width: 100%; outline: none; }
    .item select:focus, .item input:focus { border-color: var(--epi-yellow); }

    .sync-btn { background: var(--epi-yellow); color: #000; border: none; padding: 10px; border-radius: 4px; font-weight: 900; cursor: pointer; text-transform: uppercase; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 5px; }
    .sync-btn:hover { background: #e6b800; }

    main { padding: 25px 20px; max-width: 98vw; margin: 0 auto; display: none; }
    
    .table-wrapper { overflow-x: auto; margin-bottom: 20px; background: var(--card); padding: 15px; border-radius: 6px; border: 1px solid #333; }
    
    /* --- CONSUMPTION TABLE STYLES --- */
    .consumption-table { width: 100%; border-collapse: collapse; min-width: 1000px; }
    .consumption-table th { background: #222; color: #aaa; font-size: 0.75rem; text-transform: uppercase; font-weight: bold; padding: 12px 8px; text-align: left; border-bottom: 2px solid var(--epi-yellow); }
    .consumption-table td { padding: 8px; border-bottom: 1px solid #222; vertical-align: middle; }
    .consumption-table tr:hover { background: #1a1a1a; }

    .consumption-table input, .consumption-table select { background: #000; color: #fff; border: 1px solid #444; padding: 8px; font-size: 0.85rem; border-radius: 3px; width: 100%; outline: none; }
    .consumption-table input:focus, .consumption-table select:focus { border-color: var(--epi-yellow); }

    .col-date { width: 140px; }
    .col-shift { width: 100px; }
    .col-type { width: 180px; }
    .col-part { width: 150px; }
    .col-reason { width: 150px; }
    .col-qty { width: 80px; }
    .col-old { width: 80px; border-color: #00E676 !important; }
    .col-bend { width: 90px; border-color: #F44336 !important; }
    .col-action { width: 90px; text-align: center; }

    .btn-del-row { background: #444; color: #fff; border: none; padding: 6px 10px; border-radius: 3px; cursor: pointer; }
    .btn-del-row:hover { background: #ff4444; }

    .btn-add-row { background: #222; color: var(--epi-yellow); border: 1px dashed var(--epi-yellow); padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 15px; width: 100%; text-transform: uppercase; }
    .btn-add-row:hover { background: #333; }

    .primary-btn { background: var(--epi-yellow); color: #000; border: none; padding: 15px; border-radius: 6px; font-weight: 900; font-size: 1rem; cursor: pointer; width: 100%; max-width: 400px; margin: 20px auto; display: block; text-transform: uppercase; }
    
    .table-wrapper::-webkit-scrollbar { height: 10px; }
    .table-wrapper::-webkit-scrollbar-track { background: #111; }
    .table-wrapper::-webkit-scrollbar-thumb { background: #444; border-radius: 5px; }
    .table-wrapper::-webkit-scrollbar-thumb:hover { background: var(--epi-yellow); }

    /* Modal Styles */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 9000; padding: 20px; }
    .modal-content { background: #111; border: 1px solid #444; border-top: 4px solid var(--epi-yellow); border-radius: 8px; width: 100%; max-width: 900px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; }
    .modal-header { padding: 15px 20px; background: #000; font-weight: bold; font-size: 1.2rem; color: var(--epi-yellow); text-transform: uppercase; border-bottom: 1px solid #333; }
    .modal-body { padding: 20px; overflow-y: auto; flex-grow: 1; }
    .modal-footer { padding: 15px 20px; background: #000; border-top: 1px solid #333; display: flex; justify-content: flex-end; gap: 10px; }
    
    .summary-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; color: #fff; }
    .summary-table th { background: #222; color: #aaa; padding: 8px; text-align: left; border-bottom: 1px solid #444; text-transform: uppercase; }
    .summary-table td { padding: 8px; border-bottom: 1px solid #222; }
    
    .btn-cancel { background: transparent; border: 1px solid #666; color: #fff; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-confirm { background: var(--epi-yellow); border: none; color: #000; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: 900; text-transform: uppercase; }

    #loader { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; color: var(--epi-yellow); font-weight: bold; font-size: 1.2rem; display: none; }
</style>
</head>
<body>

<div id="loader"><i class="fas fa-spinner fa-spin fa-2x" style="margin-bottom: 15px;"></i> <span id="load-text">Processing...</span></div>

<header>
    <div class="header-container">
        <div class="header-title">ROCKTOOL CONSUMPTION REPORT</div>
    </div>
</header>

<div class="control-bar" id="auth-bar">
    <div class="item"><label>Technician ID</label><input type="text" id="user" placeholder="Tech ID"></div>
    <div class="item"><label>Password</label><input type="password" id="pass" placeholder="••••"></div>
    <div class="item"><button class="sync-btn" onclick="handleSync()"><i class="fas fa-lock" id="icon"></i> AUTHENTICATE & SYNC</button></div>
</div>

<div class="control-bar" id="data-bar" style="display: none;">
    <div class="item"><label>Customer</label><select id="cust" onchange="updateSites()"></select></div>
    <div class="item"><label>Work Site</label><select id="site" onchange="onSiteChange()"></select></div>
    
    <div class="item" style="flex-direction: row; gap: 10px;">
        <button class="sync-btn" style="background:#00E676; color:#000;" onclick="downloadCSVTemplate()"><i class="fas fa-file-csv"></i> TEMPLATE</button>
        <input type="file" id="csvFileInput" accept=".csv" style="display:none" onchange="handleFileUpload(event)">
        <button class="sync-btn" style="background:#fff; color:#000;" onclick="document.getElementById('csvFileInput').click()"><i class="fas fa-upload"></i> UPLOAD CSV</button>
        <button class="sync-btn" style="background:#333; color:#fff;" onclick="location.reload()"><i class="fas fa-sign-out-alt"></i> LOGOUT</button>
    </div>
</div>

<main id="main-area">
    <div class="table-wrapper">
        <table class="consumption-table">
            <thead>
                <tr>
                    <th class="col-date">Date</th>
                    <th class="col-shift">Shift</th>
                    <th class="col-type">Tool Type</th>
                    <th class="col-desc">Part Description</th>
                    <th class="col-part">Part No</th>
                    <th class="col-reason">Reason</th>
                    <th class="col-qty">New Qty</th>
                    <th class="col-old" style="color:#00E676;">Old Rtn</th>
                    <th class="col-bend" style="color:#F44336;">Lost/Bent</th>
                    <th class="col-action">Action</th>
                </tr>
            </thead>
            <tbody id="consumptionBody">
                <!-- Rows dynamically added via script -->
            </tbody>
        </table>
        <button type="button" class="btn-add-row" onclick="addRow()"><i class="fas fa-plus"></i> Add Tool Consumption Row</button>
    </div>
    <button type="button" class="primary-btn" onclick="reviewData()">REVIEW & SUBMIT RECORDS</button>
</main>
<div class="modal-overlay" id="confirmModal">
    <div class="modal-content">
        <div class="modal-header">Confirm Submission</div>
        <div class="modal-body">
            <p style="margin-bottom: 15px; font-size: 0.9rem; color: #ccc;">Verify quantities below. Reconcile returned vs lost items before uploading to Vault.</p>
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Shift</th>
                        <th>Tool Type</th>
                        <th>Part No</th>
                        <th>Reason</th>
                        <th>New Qty</th>
                        <th style="color:#00E676;">Old Rtn</th>
                        <th style="color:#F44336;">Lost/Bent</th>
                    </tr>
                </thead>
                <tbody id="summaryBody"></tbody>
            </table>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeModal()">Edit</button>
            <button class="btn-confirm" id="finalSubmitBtn" onclick="executeSubmission()">Confirm & Upload</button>
        </div>
    </div>
</div>


<script>
// 🚨 PASTE YOUR DEPLOYED GOOGLE APP SCRIPT URL HERE 🚨
const scriptURL = "https://script.google.com/macros/s/AKfycbwnhqpKWtP7AdhT0NGIGwNIBWv3yTUU3jtXeD6QF-phPxe5ZKaGyw2RY5WBzezfefEp/exec";

// Global Mappings
let customerToSites = {};
let siteToToolTypes = {};
let siteToolToDescriptions = {};
let siteToolDescToPartNo = {};
let typeToReasons = {}; 
let pendingPayload = []; 

window.onload = () => {};

async function handleSync() {
    const u = document.getElementById('user').value.trim();
    const p = document.getElementById('pass').value.trim();
    if (!u || !p) return alert("Please enter ID and Password");

    document.getElementById('loader').style.display = 'flex';
    document.getElementById('load-text').innerText = "Authenticating...";

    try {
        const url = scriptURL + "?action=check&u=" + encodeURIComponent(u) + "&p=" + encodeURIComponent(p) + "&t=" + new Date().getTime();
        const res = await fetch(url);
        
        const textResponse = await res.text();
        let data;
        try {
            data = JSON.parse(textResponse);
        } catch (parseErr) {
            console.error("Raw response:", textResponse);
            throw new Error("Server returned an invalid format. Check Apps Script logs.");
        }

        document.getElementById('loader').style.display = 'none';

        if (data.status === "success") {
            buildDatabase(data);
            document.getElementById('auth-bar').style.display = 'none';
            document.getElementById('data-bar').style.display = 'grid';
            
            const custSelect = document.getElementById('cust');
            custSelect.innerHTML = '<option value="">- Select Customer -</option>';
            Object.keys(customerToSites).sort().forEach(c => custSelect.add(new Option(c, c)));
            
        } else if (data.status === "server_error") {
            alert("Backend Error: " + data.message);
        } else {
            alert("Auth Failed: Incorrect Password or ID.");
        }
    } catch (err) {
        document.getElementById('loader').style.display = 'none';
        alert("Network/Auth Error: " + err.message);
    }
}

function buildDatabase(data) {
    typeToReasons = {};
    if (data.reasonsList) {
        data.reasonsList.forEach(row => {
            let type = String(row[0] || "").trim();
            let reasonStr = String(row[1] || "").trim();
            if (type && reasonStr) {
                if (!typeToReasons[type]) typeToReasons[type] = [];
                reasonStr.split(',').forEach(r => {
                    let cleanReason = r.trim();
                    if (cleanReason && !typeToReasons[type].includes(cleanReason)) typeToReasons[type].push(cleanReason);
                });
            }
        });
    }

    customerToSites = {}; 
    if (data.fleetList) {
        data.fleetList.forEach(row => {
            let cust = String(row[0] || "").trim();
            let site = String(row[2] || "").trim();
            if (cust && site) {
                if (!customerToSites[cust]) customerToSites[cust] = [];
                if (!customerToSites[cust].includes(site)) customerToSites[cust].push(site);
            }
        });
    }

    siteToToolTypes = {};
    siteToolToDescriptions = {};
    siteToolDescToPartNo = {};
    let globalToolTypes = new Set();

    if (data.toolTypesList) {
        data.toolTypesList.forEach(row => {
            // Col A = Site[cite: 7], Col B = Tool Type[cite: 7], Col C = Part Description[cite: 7], Col D = Part Number[cite: 7]
            let site = String(row[0] || "").trim().toUpperCase(); 
            let toolType = String(row[1] || "").trim();   
            let desc = String(row[2] || "").trim();       
            let partNo = String(row[3] || "").trim();     

            if (toolType) {
                globalToolTypes.add(toolType);

                // Universal / Global lookup map so it works regardless of site name variation
                if (desc) {
                    let gKey1 = "GLOBAL_" + toolType;
                    if (!siteToolToDescriptions[gKey1]) siteToolToDescriptions[gKey1] = new Set();
                    siteToolToDescriptions[gKey1].add(desc);

                    if (partNo) {
                        let gKey2 = "GLOBAL_" + toolType + "_" + desc;
                        siteToolDescToPartNo[gKey2] = partNo;
                    }
                }

                if (site && desc) {
                    let key1 = site + "_" + toolType;
                    if (!siteToolToDescriptions[key1]) siteToolToDescriptions[key1] = new Set();
                    siteToolToDescriptions[key1].add(desc);

                    if (partNo) {
                        let key2 = site + "_" + toolType + "_" + desc;
                        siteToolDescToPartNo[key2] = partNo;
                    }
                }
            }
        });
        siteToToolTypes["GLOBAL"] = globalToolTypes;
    }
}

function updateSites() {
    const s = document.getElementById('site');
    s.innerHTML = '<option value="">- Select Site -</option>';
    const c = document.getElementById('cust').value;
    if (customerToSites[c]) customerToSites[c].sort().forEach(site => s.add(new Option(site, site)));
    
    document.getElementById('consumptionBody').innerHTML = '';
    document.getElementById('main-area').style.display = 'none';
}
function onSiteChange() {
    const site = document.getElementById('site').value;
    document.getElementById('consumptionBody').innerHTML = '';
    
    if (site) {
        addRow(); // Generates tool types for the selected site
        document.getElementById('main-area').style.display = 'block';
    } else {
        document.getElementById('main-area').style.display = 'none';
    }
}

function addRow() {
    const currentSite = document.getElementById('site').value.toUpperCase();
    const defaultDate = new Date().toISOString().split('T')[0];
    
    let typeOpts = '<option value="">- Tool Type -</option>';
    
    let toolsToUse = siteToToolTypes[currentSite] && siteToToolTypes[currentSite].size > 0 
        ? siteToToolTypes[currentSite] 
        : siteToToolTypes["GLOBAL"];

    if (toolsToUse) {
        Array.from(toolsToUse).sort().forEach(t => {
            typeOpts += `<option value="${t}">${t}</option>`;
        });
    }

    const uniqueDescId = 'desc-dl-' + Math.random().toString(36).substr(2, 9);
    const uniquePartId = 'part-dl-' + Math.random().toString(36).substr(2, 9);

    const tbody = document.getElementById('consumptionBody');
    const tr = document.createElement('tr');
    tr.className = "consumption-row";
    tr.innerHTML = `
        <td class="col-date"><input type="date" class="r-date" value="${defaultDate}"></td>
        <td class="col-shift">
            <select class="r-shift">
                <option value="SHIFT C">Shift C</option>
                <option value="SHIFT A">Shift A</option>
                <option value="SHIFT B">Shift B</option>
            </select>
        </td>
        <td class="col-type"><select class="r-type" onchange="updateToolTypeCascade(this)">${typeOpts}</select></td>
        <td class="col-desc">
            <input type="text" class="r-desc" list="${uniqueDescId}" placeholder="- Select or Type -" 
                   onfocus="this.setAttribute('list', '${uniqueDescId}');" 
                   oninput="updateDescriptionCascade(this)">
            <datalist id="${uniqueDescId}"></datalist>
        </td>
        <td class="col-part">
            <input type="text" class="r-part" list="${uniquePartId}" placeholder="- Enter Part No -"
                   onfocus="this.setAttribute('list', '${uniquePartId}');">
            <datalist id="${uniquePartId}"></datalist>
        </td>
        <td class="col-reason"><select class="r-reason"><option value="">- Reason -</option></select></td>
        <td class="col-qty"><input type="number" class="r-qty" placeholder="0"></td>
        <td class="col-old"><input type="number" class="r-old" placeholder="0"></td>
        <td class="col-bend"><input type="number" class="r-bend" placeholder="0"></td>
        <td class="col-action"><button type="button" class="btn-del-row" onclick="this.closest('tr').remove()" title="Delete Row"><i class="fas fa-trash"></i></button></td>
    `;
    tbody.appendChild(tr);
}

function updateToolTypeCascade(el) {
    const row = el.closest('tr');
    const currentSite = document.getElementById('site').value.toUpperCase();
    const toolType = el.value;
    
    const descInput = row.querySelector('.r-desc');
    const descDatalist = descInput.nextElementSibling;
    
    const partInput = row.querySelector('.r-part');
    const partDatalist = partInput.nextElementSibling;
    
    const reasonSel = row.querySelector('.r-reason');
    
    descInput.value = '';
    descDatalist.innerHTML = '';
    partInput.value = '';
    partDatalist.innerHTML = '';
    reasonSel.innerHTML = '<option value="">- Reason -</option>';
    
    // 1. Populate Part Descriptions datalist dynamically for this Tool Type
    let key1 = currentSite + "_" + toolType;
    if (!siteToolToDescriptions[key1] || siteToolToDescriptions[key1].size === 0) {
        key1 = "GLOBAL_" + toolType;
    }

    // Fallback: Also gather any description matching this tool type globally if key is missing
    let descriptionsTopper = siteToolToDescriptions[key1] ? Array.from(siteToolToDescriptions[key1]) : [];
    if (descriptionsTopper.length === 0) {
        Object.keys(siteToolToDescriptions).forEach(k => {
            if (k.includes(toolType)) {
                siteToolToDescriptions[k].forEach(d => descriptionsTopper.push(d));
            }
        });
    }

    Array.from(new Set(descriptionsTopper)).sort().forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        descDatalist.appendChild(opt);
    });

    // 2. Populate Part Numbers suggestions datalist
    let allPartsForType = new Set();
    Object.keys(siteToolDescToPartNo).forEach(k => {
        if (k.includes(toolType)) {
            allPartsForType.add(siteToolDescToPartNo[k]);
        }
    });
    Array.from(allPartsForType).sort().forEach(p => {
        const opt = document.createElement('option');
        opt.value = p;
        partDatalist.appendChild(opt);
    });

    // 3. Populate Reasons
    if (typeToReasons[toolType]) {
        typeToReasons[toolType].sort().forEach(r => {
            reasonSel.add(new Option(r, r));
        });
    }
}

function updateDescriptionCascade(el) {
    const row = el.closest('tr');
    const currentSite = document.getElementById('site').value.toUpperCase();
    const toolType = row.querySelector('.r-type').value;
    const desc = el.value.trim();
    const partInput = row.querySelector('.r-part');

    if (!desc) return;

    let key2 = currentSite + "_" + toolType + "_" + desc;
    if (!siteToolDescToPartNo[key2]) {
        key2 = "GLOBAL_" + toolType + "_" + desc;
    }

    if (siteToolDescToPartNo[key2]) {
        partInput.value = siteToolDescToPartNo[key2];
    }
}function reviewData() {
    pendingPayload = [];
    const summaryBody = document.getElementById('summaryBody');
    summaryBody.innerHTML = '';
    
    const tech = document.getElementById('user').value;
    const pass = document.getElementById('pass').value;
    const cust = document.getElementById('cust').value;
    const site = document.getElementById('site').value;

    document.querySelectorAll('.consumption-row').forEach(row => {
        const rowDate = row.querySelector('.r-date').value;
        const shift = row.querySelector('.r-shift').value;
        const type = row.querySelector('.r-type').value;
        const desc = row.querySelector('.r-desc').value;
        const partNo = row.querySelector('.r-part').value;
        const reason = row.querySelector('.r-reason').value;
        const qty = parseFloat(row.querySelector('.r-qty').value) || 0;
        const oldRtn = parseFloat(row.querySelector('.r-old').value) || 0;
        const bendLost = parseFloat(row.querySelector('.r-bend').value) || 0;

        if (type && qty > 0) {
            pendingPayload.push({
                Technician_Name: tech,
                Unlock_Password: pass,
                Customer_Name: cust,
                Work_Site: site,
                Shift: shift,
                Fleet_ID: "N/A",
                Entry_Date: rowDate,
                Part_Group: "",
                Part_Type: type,
                Part_Description: desc,
                Part_Number: partNo,
                Quantity: qty,
                Reason_to_Replace: reason,
                Remarks: "Added via App",
                Old_Return_Qty: oldRtn,
                Bend_Lost_Qty: bendLost,
                Unit_Price: 0,
                File_ID: "BULK_" + Date.now()
            });

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${rowDate}</td>
                <td><span style="color: var(--epi-yellow);">${shift}</span></td>
                <td>${type}<br><span style="color:#aaa; font-size:0.75rem;">${desc || ""}</span></td>
                <td>${partNo || "-"}</td>
                <td>${reason || "-"}</td>
                <td style="font-weight: bold;">${qty}</td>
                <td style="color: #00E676; font-weight: bold;">${oldRtn}</td>
                <td style="color: #F44336; font-weight: bold;">${bendLost}</td>
            `;
            summaryBody.appendChild(tr);
        }
    });

    if (pendingPayload.length === 0) return alert("No valid consumption data entered. Please select Tool Type, Part Description, and New Qty.");
    document.getElementById('confirmModal').style.display = 'flex';
}

function closeModal() { 
    document.getElementById('confirmModal').style.display = 'none'; 
}

async function executeSubmission() {
    closeModal();
    const btn = document.getElementById('finalSubmitBtn');
    btn.disabled = true;

    document.getElementById('loader').style.display = 'flex';
    document.getElementById('load-text').innerText = "Uploading to Vault...";

    try {
        await fetch(scriptURL, { method: "POST", body: JSON.stringify(pendingPayload), mode: 'no-cors' });
        document.getElementById('loader').style.display = 'none';
        alert(`✅ SUCCESS: ${pendingPayload.length} consumption records saved to Database.`);
        
        document.getElementById('consumptionBody').innerHTML = '';
        addRow();
        
        btn.disabled = false;
        pendingPayload = [];
    } catch (err) {
        document.getElementById('loader').style.display = 'none';
        alert("❌ Submission Error: " + err);
        btn.disabled = false;
    }
}

function downloadCSVTemplate() {
    const headers = [
        "Entry_Date", "Shift", "Part_Type", "Part_Description", "Part_Number", 
        "Quantity", "Reason_to_Replace", "Old_Return_Qty", "Bend_Lost_Qty", "Remarks"
    ];
    const csvContent = "data:text/csv;charset=utf-8," + headers.join(",") + "\n";
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "Rocktool_Consumption_Template.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

async function handleFileUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const activeTech = document.getElementById('user').value;
    const activePass = document.getElementById('pass').value;
    const activeCust = document.getElementById('cust').value;
    const activeSite = document.getElementById('site').value;

    if (!activeCust || !activeSite) {
        alert("Please select a Customer and Work Site before uploading the CSV.");
        event.target.value = '';
        return;
    }

    document.getElementById('loader').style.display = 'flex';
    document.getElementById('load-text').innerText = "Parsing & Uploading CSV...";

    const reader = new FileReader();
    reader.onload = async function(e) {
        const text = e.target.result;
        const rows = text.split("\n").filter(row => row.trim() !== "");
        let jsonData = [];
        
        for (let i = 1; i < rows.length; i++) {
            const rowsValues = rows[i].split(",");
            if (!rowsValues[0] || rowsValues[0].trim() === "") continue;

            jsonData.push({
                Technician_Name: activeTech,
                Unlock_Password: activePass,
                Customer_Name: activeCust,
                Work_Site: activeSite,
                Entry_Date: rowsValues[0] ? rowsValues[0].trim() : "",
                Shift: rowsValues[1] ? rowsValues[1].trim() : "SHIFT C",
                Fleet_ID: "N/A",
                Part_Type: rowsValues[2] ? rowsValues[2].trim() : "",
                Part_Description: rowsValues[3] ? rowsValues[3].trim() : "",
                Part_Number: rowsValues[4] ? rowsValues[4].trim() : "",
                Quantity: parseFloat(rowsValues[5]) || 0,
                Reason_to_Replace: rowsValues[6] ? rowsValues[6].trim() : "",
                Old_Return_Qty: parseFloat(rowsValues[7]) || 0,
                Bend_Lost_Qty: parseFloat(rowsValues[8]) || 0,
                Unit_Price: 0,
                Remarks: rowsValues[9] ? rowsValues[9].trim() : "Bulk Upload",
                File_ID: "BULK_" + Date.now() + "_" + i
            });
        }

        try {
            await fetch(scriptURL, { method: "POST", body: JSON.stringify(jsonData), mode: 'no-cors' });
            document.getElementById('loader').style.display = 'none';
            alert(`✅ Success: ${jsonData.length} records processed for site ${activeSite}.`);
            event.target.value = '';
        } catch (err) {
            document.getElementById('loader').style.display = 'none';
            alert("Upload Error: " + err);
            event.target.value = '';
        }
    };
    reader.readAsText(file);
}
</script>
</body>
</html>
